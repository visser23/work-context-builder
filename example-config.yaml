version: 1

project:
  id: "my-project"
  name: "My Project"
  # macOS:   ~/Documents/WorkContext/my-project
  # Linux:   ~/work-context/my-project
  # Windows: ~/OneDrive - Company/WorkContext/my-project
  output_root: "~/Documents/WorkContext/my-project"
  # Optional: override default state directory (DB, logs, lock file).
  # If omitted, defaults to platform-specific app data location.
  # state_dir: "~/Documents/WorkContext/my-project/_state"

schedule:
  hour: 5
  minute: 30

sync:
  overlap_minutes: 15
  reconciliation_days: 7
  max_concurrency: 12
  large_document_chars: 300000

sources:

  # ──────────────────────────────────────────────────────────
  # Confluence — supports both Cloud (.atlassian.net) and Data Center
  # ──────────────────────────────────────────────────────────
  confluence:
    - name: "my-wiki"
      base_url: "https://company.atlassian.net"   # or https://confluence.internal.com
      deployment: "auto"                           # auto | cloud | datacenter
      spaces:
        - "PROJ"
        - "ARCH"
      auth:
        mode: "api_token"       # Cloud: api_token, DC: pat
        username: "user@company.com"  # Cloud only — omit for DC PAT
        secret_ref: "workctx/my-project/confluence"
      include_attachments: false

  # ──────────────────────────────────────────────────────────
  # Jira — supports both Cloud (.atlassian.net) and Data Center
  # ──────────────────────────────────────────────────────────
  jira:
    - name: "my-jira"
      base_url: "https://company.atlassian.net"   # or https://jira.internal.com
      deployment: "auto"                           # auto | cloud | datacenter
      projects:
        - "PROJ"
        - "OPS"
      auth:
        mode: "api_token"       # Cloud: api_token, DC: pat
        username: "user@company.com"  # Cloud only — omit for DC PAT
        secret_ref: "workctx/my-project/jira"
      include_comments: true
      include_changelog: false
      include_attachments: false

  # ──────────────────────────────────────────────────────────
  # SharePoint — two modes depending on your setup
  # ──────────────────────────────────────────────────────────
  sharepoint:

    # Option A: OneDrive local sync (if library is synced to your machine).
    # This is the preferred mode — no browser automation needed.
    - name: "my-documents"
      site_url: "https://tenant.sharepoint.com/sites/MySite"
      mode: "onedrive_local"
      local_path: "~/Library/CloudStorage/OneDrive-Company/MySite/Documents"
      # Windows: "C:/Users/you/OneDrive - Company/MySite/Documents"
      include: ["**/*"]
      exclude: ["**/~$*", "**/.DS_Store", "**/*.tmp"]

    # Option B: Browser-based (for libraries NOT synced locally).
    # Uses Playwright to capture SharePoint session cookies.
    # First run: workctx auth login-sharepoint --source team-sharepoint
    # - name: "team-sharepoint"
    #   site_url: "https://tenant.sharepoint.com/sites/TeamSite"
    #   mode: "browser"
    #   doc_library: "Documents"  # Check the *list title* in Site Contents (often "Documents" or "Shared Documents")
    #   server_relative_path: "/sites/TeamSite/Shared Documents"
    #   include: ["**/*"]
    #   exclude: ["**/~$*", "**/.DS_Store", "**/*.tmp"]
    #   auth:
    #     mode: browser
    #     secret_ref: "workctx/my-project/sp-cookies"

  # ──────────────────────────────────────────────────────────
  # Teams meeting transcripts — reuses a browser-mode SharePoint login
  # ──────────────────────────────────────────────────────────
  # Pulls the transcripts of Teams meetings you recorded (or that were shared
  # with you) into transcripts/<source>/<year>/. Requires a SharePoint source
  # above with `auth.mode: browser` that you have logged in to
  # (workctx auth login-sharepoint --source <name>).
  # transcripts:
  #   - name: "teams-transcripts"
  #     sharepoint_source: "my-sharepoint"   # name of the browser-mode source
  #     # include_own: true                  # meetings you organised
  #     # include_shared: true               # recordings shared directly with you
  #     # include_invited: true              # every meeting you were invited to (default)
  #     # include_all_sites: false           # also read-only sites (org-wide webinars)
  #     # sites:                             # extra sites whose recordings are always included
  #     #   - "https://contoso.sharepoint.com/sites/MyTeam"
  #     # since_days: 365                    # only meetings from the last N days
  #     # exclude_titles: ["*1:1*"]            # case-insensitive globs on the title

  # ──────────────────────────────────────────────────────────
  # Email, calendar and Slack — read through your logged-in browser profile
  # ──────────────────────────────────────────────────────────
  # No app registration or API token: these reuse the browser profile that
  # already holds your single-sign-on session (same one as a `mode: browser`
  # SharePoint source). Credentials are read at sync time and kept in memory
  # only. Everything is read-only. If a session lapses, sign in once with
  #   workctx auth login-web --source <name>
  # Use `sharepoint_source: <name>` to share a SharePoint login, or
  # `profile: <name>` for a standalone browser profile.
  #
  # mail:                                    # Outlook / Exchange Online, one file per message
  #   - name: "work-mail"
  #     sharepoint_source: "my-sharepoint"
  #     # folders: ["inbox", "sentitems"]    # well-known names or custom folder names
  #     # since_days: 30                     # rolling window
  #     # exclude_senders: ["noreply@*"]     # globs on address or display name
  #     # exclude_subjects: ["automatic reply*"]
  #     # trim_quoted_replies: true          # drop quoted history below a reply
  #     # max_body_chars: 20000
  #
  # calendar:                                # one file per event/occurrence
  #   - name: "work-calendar"
  #     sharepoint_source: "my-sharepoint"
  #     # past_days: 30
  #     # future_days: 60
  #     # include_cancelled: false
  #     # exclude_titles: ["lunch", "focus time*"]
  #
  # slack:                                   # one digest per conversation per day
  #   - name: "work-slack"
  #     sharepoint_source: "my-sharepoint"
  #     client_url: "https://app.slack.com/client/<ENTERPRISE-OR-TEAM-ID>/"   # as in your browser
  #     # signin_url: "https://<org>.enterprise.slack.com/"  # for silent SSO sign-in if logged out
  #     # since_days: 14
  #     # conversation_types: ["public_channel", "private_channel", "mpim", "im"]
  #     # workspaces: ["my-workspace"]         # default: every workspace you belong to
  #     # include_channels: ["team-*"]         # globs; default: everything you are in
  #     # exclude_channels: ["random", "*-alerts"]
  #     # include_threads: true

  # ──────────────────────────────────────────────────────────
  # Local folders — scan any directories on your filesystem
  # ──────────────────────────────────────────────────────────
  # local_folders:
  #   - name: "project-files"
  #     paths:
  #       - "~/Documents/Projects"
  #       - "~/OneDrive/SharedDocs"
  #     include: ["**/*"]
  #     exclude: ["**/node_modules/**", "**/.git/**", "**/dist/**"]

# ──────────────────────────────────────────────────────────
# Notifications (optional)
# ──────────────────────────────────────────────────────────
notifications:
  telegram:
    enabled: false
    # To enable: create a bot via @BotFather, store the token:
    #   workctx auth set workctx/my-project/telegram-bot
    #   workctx auth set workctx/my-project/telegram-chat
    # bot_token_ref: "workctx/my-project/telegram-bot"
    # chat_id_ref: "workctx/my-project/telegram-chat"

  macos:
    enabled: true    # macOS notification centre alerts on failure
