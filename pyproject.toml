[project]
name = "work-context-mirror"
version = "0.1.0"
description = "Lightweight macOS tool to create and maintain a local, LLM-friendly mirror of work knowledge from Confluence, Jira, and SharePoint/OneDrive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Matt Visser" }]

dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "markitdown>=0.1",
    "pymupdf4llm>=0.0.17",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
playwright = [
    "playwright>=1.44",
]
docling = [
    "docling>=2.0",
]

[project.scripts]
workctx = "workctx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workctx"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
